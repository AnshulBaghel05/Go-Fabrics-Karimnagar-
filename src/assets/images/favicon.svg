<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="gf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#380912"/>
      <stop offset="40%" stop-color="#7B0F3B"/>
      <stop offset="100%" stop-color="#C2185B"/>
    </linearGradient>
    <linearGradient id="gf-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5C2"/>
      <stop offset="35%" stop-color="#F3D58C"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#A67C1E"/>
    </linearGradient>
    <filter id="gf-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Luxurious Boutique Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="15" ry="15" fill="url(#gf-bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="15" ry="15" fill="none" stroke="url(#gf-gold)" stroke-width="1.8"/>

  <!-- Delicate Inset Zari Hairline -->
  <rect x="5.5" y="5.5" width="53" height="53" rx="12" ry="12" fill="none" stroke="url(#gf-gold)" stroke-width="0.75" stroke-opacity="0.55" stroke-dasharray="3 1.5"/>

  <!-- Flowing Pallu Drape Curve Motif -->
  <path d="M12 47 C16 41, 19.5 31, 21.5 20 C22.5 15, 24.5 12, 27.5 11 C25.5 15.5, 23.5 23, 21.5 33 C19.5 43, 15.5 47, 12 47 Z" fill="url(#gf-gold)" opacity="0.38"/>

  <!-- "GF" Boutique Monogram -->
  <g filter="url(#gf-shadow)">
    <!-- Letter G -->
    <path d="M29 25.5 C27.5 22.2 24.2 20.2 20 20.5 C14.8 21 11.2 25.5 11.2 32 C11.2 38.5 15.2 43 21 43 C25.8 43 28.8 39.5 29.5 35.2 L22 35.2 L22 31.8 L33.5 31.8 C33.8 33.2 33.8 34.8 33.5 36.8 C32.2 42.5 27.5 46.5 20.8 46.5 C13 46.5 7.5 40.2 7.5 32 C7.5 23.2 13.5 17.2 21 17.2 C25.5 17.2 29.2 19.4 31.8 22.8 Z" fill="url(#gf-gold)"/>

    <!-- Letter F with Regal Serif -->
    <path d="M36 18.5 L52.5 18.5 L52.5 22.5 L41.5 22.5 L41.5 29.2 L49.8 29.2 L49.8 33 L41.5 33 L41.5 45.5 L36 45.5 Z" fill="url(#gf-gold)"/>

    <!-- Traditional Gold Zari Sparkle Accent -->
    <polygon points="52.5,9.5 54,12.5 57,14 54,15.5 52.5,18.5 51,15.5 48,14 51,12.5" fill="#FFF9D2"/>
    <circle cx="52.5" cy="14" r="0.8" fill="#D4AF37"/>
  </g>
</svg>
